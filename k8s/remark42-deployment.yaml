apiVersion: apps/v1
kind: Deployment
metadata:
  name: remark42
  namespace: astro-blog
  labels:
    app: remark42
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remark42
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: remark42
    spec:
      containers:
      - name: remark42
        image: ghcr.io/umputun/remark42:v1.15.0
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: REMARK_URL
          value: https://comments.iwaningman.com/
        - name: SITE
          value: www.iwaningman.com
        - name: AUTH_ANON
          value: "true"
        - name: SECRET
          valueFrom:
            secretKeyRef:
              name: remark42
              key: SECRET
        - name: SMTP_HOST
          value: smtp.eu.mailgun.org
        - name: SMTP_PORT
          value: "587"
        - name: SMTP_TLS
          value: "false"
        - name: SMTP_STARTTLS
          value: "true"
        - name: SMTP_USERNAME
          valueFrom:
            secretKeyRef:
              name: remark42
              key: SMTP_USERNAME
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: remark42
              key: SMTP_PASSWORD
        - name: AUTH_EMAIL_FROM
          value: "Comments <comments@iwani.dev>"
        - name: NOTIFY_EMAIL_FROM
          value: "Comments <comments@iwani.dev>"
        - name: NOTIFY_USERS
          value: "email"
        - name: ADMIN_SHARED_EMAIL
          valueFrom:
            secretKeyRef:
              name: remark42
              key: ADMIN_SHARED_EMAIL
        - name: AUTH_EMAIL_ENABLE
          value: "true"
        - name: ADMIN_SHARED_ID
          valueFrom:
            secretKeyRef:
              name: remark42
              key: ADMIN_SHARED_ID

        volumeMounts:
        - name: srvvar
          mountPath: /srv/var
        securityContext:
          readOnlyRootFilesystem: false
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
      volumes:
      - name: srvvar
        persistentVolumeClaim:
          claimName: remark42