apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: astro-blog

resources:
- namespace.yaml
- deployment.yaml
- service.yaml
- ingress.yaml

# Use this for image tag management
images:
- name: astro-blog
  newName: ${REGISTRY}/${IMAGE_NAME}
  newTag: ${IMAGE_TAG}

