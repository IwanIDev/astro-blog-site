apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: astro-blog-web
  namespace: astro-blog
  labels:
    app: astro-blog
  annotations:
    # For k3s, traefik is the default ingress controller
    cert-manager.io/cluster-issuer: "letsencrypt-prod"  # Optional: if using cert-manager
spec:
  ingressClassName: traefik  # k3s default
  rules:
  - host: yourdomain.com  # Change this to your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: astro-blog-web
            port:
              number: 80
  # TLS configuration (optional, requires cert-manager)
  # tls:
  # - hosts:
  #   - yourdomain.com
  #     secretName: astro-blog-tls
