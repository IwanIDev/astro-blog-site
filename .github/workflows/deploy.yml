name: Deploy Astro site to AWS

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}
  TF_STATE_KEY: astro-blog-site/terraform.tfstate

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Configure AWS credentials for Terraform
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}

      - name: Initialize Terraform
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

      - name: Apply Terraform infrastructure
        working-directory: terraform
        run: |
          terraform apply \
            -auto-approve \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="github_repository=${{ github.repository }}" \
            -var="github_branch=${{ github.ref_name }}"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install Openring
        run: go install git.sr.ht/~sircmpwn/openring@latest

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Build Astro site
        run: bun run build
        env:
          VITE_DRUPAL_BASE_URL: ${{ vars.VITE_DRUPAL_BASE_URL }}
          VITE_DRUPAL_API_PREFIX: ${{ vars.VITE_DRUPAL_API_PREFIX }}
          UMAMI_SITE_ID: ${{ vars.UMAMI_SITE_ID }}

      - name: Read deployment outputs
        id: outputs
        working-directory: terraform
        run: |
          echo "bucket=$(terraform output -raw s3_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "role_arn=$(terraform output -raw github_actions_role_arn)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials for site deployment
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ steps.outputs.outputs.role_arn }}

      - name: Upload site to S3
        run: |
          aws s3 sync dist/ "s3://${{ steps.outputs.outputs.bucket }}" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.outputs.outputs.distribution_id }}" \
            --paths "/*"
