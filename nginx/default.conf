server {
  listen 8380;
  listen [::]:8380;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  port_in_redirect off;

  error_page 404 /404.html;

  rewrite ^/posts/(.+)\.md$ /posts/$1 permanent;

  location / {
    try_files $uri $uri/index.html =404;
  }
}
